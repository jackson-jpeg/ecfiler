# ECFiler hosted API — permanent vhost.
# TLS: run `certbot --nginx -d api.ecfiler.com` once DNS exists
# (A 187.77.218.14 / AAAA 2a02:4780:4:1c0b::1 on the ecfiler.com zone).
server {
    server_name api.ecfiler.com;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100M;
    }

    listen 187.77.218.14:80;
    listen [2a02:4780:4:1c0b::1]:80;
}
