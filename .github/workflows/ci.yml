name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  ECFILER_DEV_AUTH: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"

      - name: Install Playwright
        run: |
          playwright install chromium --with-deps

      - name: Run tests
        run: |
          python -m pytest tests/ -q --ignore=tests/test_browser_e2e.py

      - name: Run browser E2E tests
        run: |
          python -m pytest tests/test_browser_e2e.py -q

      - name: Verify all imports
        run: |
          python -c "
          import importlib, pkgutil, ecfiler
          for _, modname, _ in pkgutil.walk_packages(ecfiler.__path__, 'ecfiler.'):
              importlib.import_module(modname)
          print('All modules OK')
          "

      - name: Verify CLI
        run: |
          python -m ecfiler --version
          python -m ecfiler check

  web:
    # Builds the marketing site and verifies every advertised free tool is
    # reachable by an anonymous browser (tests/test_web_public_access.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
          playwright install chromium --with-deps

      - name: Build web
        working-directory: web
        env:
          # Placeholder is fine: the anonymous pass never verifies a session,
          # and this build is discarded (Vercel builds production itself).
          CLERK_SECRET_KEY: sk_test_placeholder_for_anon_verification
        run: |
          npm ci
          npm run build

      - name: Serve and verify anonymously
        env:
          CLERK_SECRET_KEY: sk_test_placeholder_for_anon_verification
        run: |
          (cd web && npx next start -p 3100 &)
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:3100/tools && break
            sleep 1
          done
          ECFILER_WEB_URL=http://127.0.0.1:3100 python -m pytest tests/test_web_public_access.py -q
